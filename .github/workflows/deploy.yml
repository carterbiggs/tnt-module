name: Build + Deploy dev

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/tnt-server
  SERVICE_NAME: tnt-server

jobs:
  # ───────────────────────────── BUILD & PUSH ─────────────────────────────
  build:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.bp.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker login → GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=raw,value=main
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push
        id: bp
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image digest to workflow summary
        run: |
          echo "### Built image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_BASE }}@${{ steps.bp.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────── DEPLOY → FMoE cluster (production) ───────────────
  # Runs on the TnT-only runner on the FMoE load balancer (label fmoe-tnt, runner group fmoe-tnt).
  # This repo is public, so that runner is kept apart from the one the private repos use: its own user,
  # and sudo lets it run only `fmoe-deploy tnt-server ...`. fmoe-deploy pulls the image once, then rolls
  # it out to .143 and .130 one at a time, and stops at the first unhealthy node (which rolls itself back).
  # Only pushes to main in this repo deploy; never pull requests.
  deploy-dev:
    name: Deploy to FMoE cluster
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'carterbiggs/tnt-module'
    runs-on: [self-hosted, fmoe-tnt]
    environment: dev
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy ${{ env.SERVICE_NAME }}
        env:
          IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build.outputs.image_digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "ghcr.io $REGISTRY_USER $REGISTRY_TOKEN" \
            | sudo -n /usr/local/sbin/fmoe-deploy "$SERVICE_NAME" "$IMAGE"
